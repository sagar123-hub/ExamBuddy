<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes | ExamBuddy</title>
  <link rel="stylesheet" href="notes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="notes-page">
    <header class="page-header">
      <a href="student-dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
      <div class="heading"><p class="eyebrow">Student Library</p><h1>My Notes</h1></div>
      <a href="user-profile.html" class="profile-link"><i class="fas fa-user"></i> Profile</a>
    </header>

    <section class="toolbar">
      <div class="search-box"><i class="fas fa-search"></i><input id="searchInput" type="search" placeholder="Search notes, subjects..." aria-label="Search notes"></div>
      <select id="branchFilter" aria-label="Filter notes by branch">
        <option value="all">All Branches</option>
        <option value="CSE">CSE</option>
        <option value="Civil">Civil</option>
        <option value="Electrical">Electrical</option>
        <option value="Electronics">Electronics</option>
        <option value="FPP">FPP</option>
      </select>
    </section>

    <section class="notes-card">
      <div class="card-header"><h2><i class="fas fa-book-open"></i> Available Notes</h2><span id="noteCount">0 notes</span></div>
      <div id="notesList" class="notes-list"></div>
    </section>
  </main>
  <script src="notes.js"></script>
</body>
</html>
