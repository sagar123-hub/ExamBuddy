<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ExamBuddy</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="register-container">
    <section class="logo-section">
      <div class="logo-icon">📚</div>
      <h1>ExamBuddy</h1>
      <p class="tagline">Create your learning account</p>
    </section>

    <form id="registerForm" novalidate>
      <div class="input-group">
        <label for="name"><i class="fas fa-user"></i> Full Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="input-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" minlength="6" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" minlength="6" required>
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <fieldset class="role-group">
        <legend><i class="fas fa-users"></i> Select your role</legend>

        <label class="role-option">
          <input type="radio" name="role" value="student" required>
          <span><i class="fas fa-user-graduate"></i> Student</span>
        </label>

        <label class="role-option">
          <input type="radio" name="role" value="uploader">
          <span><i class="fas fa-cloud-upload-alt"></i> Uploader</span>
        </label>
      </fieldset>

      <p id="formMessage" class="form-message" role="alert"></p>

      <button type="submit" class="register-btn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <p class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </main>

  <script src="register.js"></script>
</body>
</html>
