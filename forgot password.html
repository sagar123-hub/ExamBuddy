<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | ExamBuddy</title>
  <link rel="stylesheet" href="forgot-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="forgot-container">
    <div class="logo-icon">🔐</div>
    <h1>Forgot Password?</h1>
    <p class="intro">Enter your registered email address to reset your password.</p>

    <form id="forgotForm" novalidate>
      <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
      <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email" required>
      <p id="message" class="message" role="alert"></p>
      <button type="submit"><i class="fas fa-key"></i> Reset Password</button>
    </form>

    <a class="back-link" href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </main>
  <script src="forgot-password.js"></script>
</body>
</html>
